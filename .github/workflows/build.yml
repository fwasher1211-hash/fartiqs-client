name: build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Build
        run: |
          FAPI=$(curl -s -A "fartiqs-client-ci" 'https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%221.21.11%22%5D&loaders=%5B%22fabric%22%5D' | jq -r '.[0].version_number // empty' || true)
          LOADER=$(curl -s https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[]|select(.stable)][0].version // empty' || true)
          echo "Fabric API: $FAPI"
          echo "Loader: $LOADER"
          ARGS=""
          if [ -n "$FAPI" ]; then ARGS="$ARGS -Pfabric_version=$FAPI"; fi
          if [ -n "$LOADER" ]; then ARGS="$ARGS -Ploader_version=$LOADER"; fi
          gradle build --no-daemon $ARGS

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: fartiqs-client
          path: build/libs/fartiqs-client-*.jar
